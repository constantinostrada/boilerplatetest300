<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boilerplatetest300</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to boilerplatetest300!</h1>

    <div class="counter-container">
        <h2>Counter</h2>
        <div id="counter-value">0</div>
        <div class="counter-buttons">
            <button id="decrement-btn">-200</button>
            <button id="increment-btn">+200</button>
            <button id="multiply-btn">×10</button>
        </div>

        <div class="submit-section">
            <textarea id="submit-input" placeholder="Enter a value to set the counter…" rows="2"></textarea>
            <div class="submit-btn-wrapper">
                <button id="submit-btn">Submit</button>
                <span class="tooltip">Press Ctrl+Enter to submit</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
