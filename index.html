<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boilerplatetest300</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to boilerplatetest300!</h1>

    <div class="counter-container">
        <h2>Counter</h2>
        <div id="counter-value">0</div>
        <div class="counter-buttons">
            <button id="decrement-btn">-200</button>
            <button id="increment-btn">+200</button>
            <button id="multiply-btn">×10</button>
        </div>
    </div>

    <div class="form-container">
        <h2>Contact Us</h2>

        <div id="form-success" class="form-feedback form-feedback--success" hidden>
            ✓ Your message has been sent successfully!
        </div>
        <div id="form-error" class="form-feedback form-feedback--error" hidden>
            Something went wrong. Please try again later.
        </div>

        <form id="contact-form" novalidate>
            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Your full name" />
                <span class="field-error" id="name-error" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="you@example.com" />
                <span class="field-error" id="email-error" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="subject">Subject <span class="required">*</span></label>
                <input type="text" id="subject" name="subject" placeholder="What is this about?" />
                <span class="field-error" id="subject-error" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="message">Message <span class="required">*</span></label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here…"></textarea>
                <span class="field-error" id="message-error" aria-live="polite"></span>
            </div>

            <button type="submit" id="submit-btn">Send Message</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
