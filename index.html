<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boilerplatetest300</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to boilerplatetest300!</h1>

    <div class="counter-container">
        <h2>Counter</h2>
        <div id="counter-value">0</div>
        <div class="counter-buttons">
            <button id="decrement-btn">-200</button>
            <button id="increment-btn">+200</button>
            <button id="multiply-btn">×10</button>
        </div>
    </div>

    <div class="form-container">
        <h2>Contact Form</h2>
        <form id="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Your message" required></textarea>
            </div>
            <button type="submit" id="submit-btn">Submit</button>
        </form>
        <div id="success-message" class="success-message hidden">Form submitted successfully!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
