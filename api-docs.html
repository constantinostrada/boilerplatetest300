<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Docs — boilerplatetest300</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
    <style>
      /* ── branding bar ── */
      .api-docs-header {
        background: #1a1a2e;
        color: #fff;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: sans-serif;
      }

      .api-docs-header h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .api-docs-header .badge {
        font-size: 0.75rem;
        background: #4a90e2;
        color: #fff;
        border-radius: 4px;
        padding: 2px 8px;
        font-weight: 500;
      }

      /* ── hide the default swagger top-bar so our header stays ── */
      .swagger-ui .topbar {
        display: none;
      }

      /* ── make the info block a little tighter ── */
      .swagger-ui .info {
        margin: 24px 0 8px;
      }
    </style>
  </head>
  <body>
    <div class="api-docs-header">
      <h1>boilerplatetest300 — API Reference</h1>
      <span class="badge">v1.0.0</span>
    </div>

    <div id="swagger-ui"></div>

    <!-- Swagger UI CDN -->
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" crossorigin></script>

    <!--
      Inline spec: keeps api-docs.html fully self-contained so it can be opened
      directly via file:// (no local server needed). Sourced from openapi.json —
      keep both files in sync when the API changes.
    -->
    <script id="openapi-spec" type="application/json">
      {
        "openapi": "3.0.3",
        "info": {
          "title": "boilerplatetest300 API",
          "description": "REST API for the boilerplatetest300 counter application. Provides endpoints to retrieve and mutate the current counter value.",
          "version": "1.0.0"
        },
        "servers": [
          {
            "url": "/api",
            "description": "Local development server"
          }
        ],
        "tags": [
          {
            "name": "counter",
            "description": "Operations on the counter value"
          }
        ],
        "paths": {
          "/counter": {
            "get": {
              "tags": ["counter"],
              "summary": "Get the current counter value",
              "description": "Returns the current integer value of the counter.",
              "operationId": "getCounter",
              "responses": {
                "200": {
                  "description": "The current counter value",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/CounterResponse" },
                      "example": { "value": 400 }
                    }
                  }
                },
                "500": {
                  "description": "Unexpected server error",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "Internal server error" }
                    }
                  }
                }
              }
            }
          },
          "/counter/increment": {
            "post": {
              "tags": ["counter"],
              "summary": "Increment the counter",
              "description": "Adds the specified `amount` to the current counter value and returns the updated value. Defaults to `200` if no body is provided.",
              "operationId": "incrementCounter",
              "requestBody": {
                "required": false,
                "content": {
                  "application/json": {
                    "schema": { "$ref": "#/components/schemas/AmountBody" },
                    "example": { "amount": 200 }
                  }
                }
              },
              "responses": {
                "200": {
                  "description": "Counter incremented successfully",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/CounterResponse" },
                      "example": { "value": 600 }
                    }
                  }
                },
                "400": {
                  "description": "Invalid request body",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "amount must be a number" }
                    }
                  }
                },
                "500": {
                  "description": "Unexpected server error",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "Internal server error" }
                    }
                  }
                }
              }
            }
          },
          "/counter/decrement": {
            "post": {
              "tags": ["counter"],
              "summary": "Decrement the counter",
              "description": "Subtracts the specified `amount` from the current counter value and returns the updated value. Defaults to `200` if no body is provided.",
              "operationId": "decrementCounter",
              "requestBody": {
                "required": false,
                "content": {
                  "application/json": {
                    "schema": { "$ref": "#/components/schemas/AmountBody" },
                    "example": { "amount": 200 }
                  }
                }
              },
              "responses": {
                "200": {
                  "description": "Counter decremented successfully",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/CounterResponse" },
                      "example": { "value": 200 }
                    }
                  }
                },
                "400": {
                  "description": "Invalid request body",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "amount must be a number" }
                    }
                  }
                },
                "500": {
                  "description": "Unexpected server error",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "Internal server error" }
                    }
                  }
                }
              }
            }
          },
          "/counter/multiply": {
            "post": {
              "tags": ["counter"],
              "summary": "Multiply the counter",
              "description": "Multiplies the current counter value by the specified `factor` and returns the updated value. Defaults to `10` if no body is provided.",
              "operationId": "multiplyCounter",
              "requestBody": {
                "required": false,
                "content": {
                  "application/json": {
                    "schema": { "$ref": "#/components/schemas/FactorBody" },
                    "example": { "factor": 10 }
                  }
                }
              },
              "responses": {
                "200": {
                  "description": "Counter multiplied successfully",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/CounterResponse" },
                      "example": { "value": 4000 }
                    }
                  }
                },
                "400": {
                  "description": "Invalid request body",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "factor must be a number" }
                    }
                  }
                },
                "500": {
                  "description": "Unexpected server error",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "Internal server error" }
                    }
                  }
                }
              }
            }
          },
          "/counter/reset": {
            "post": {
              "tags": ["counter"],
              "summary": "Reset the counter",
              "description": "Resets the counter to zero (or to an optional `value`) and returns the updated value.",
              "operationId": "resetCounter",
              "requestBody": {
                "required": false,
                "content": {
                  "application/json": {
                    "schema": { "$ref": "#/components/schemas/ResetBody" },
                    "example": { "value": 0 }
                  }
                }
              },
              "responses": {
                "200": {
                  "description": "Counter reset successfully",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/CounterResponse" },
                      "example": { "value": 0 }
                    }
                  }
                },
                "400": {
                  "description": "Invalid request body",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "value must be a number" }
                    }
                  }
                },
                "500": {
                  "description": "Unexpected server error",
                  "content": {
                    "application/json": {
                      "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                      "example": { "error": "Internal server error" }
                    }
                  }
                }
              }
            }
          }
        },
        "components": {
          "schemas": {
            "CounterResponse": {
              "type": "object",
              "required": ["value"],
              "properties": {
                "value": {
                  "type": "integer",
                  "description": "The current counter value after the operation",
                  "example": 400
                }
              }
            },
            "AmountBody": {
              "type": "object",
              "properties": {
                "amount": {
                  "type": "integer",
                  "description": "The amount to add or subtract. Defaults to 200.",
                  "default": 200,
                  "example": 200
                }
              }
            },
            "FactorBody": {
              "type": "object",
              "properties": {
                "factor": {
                  "type": "number",
                  "description": "The multiplier to apply to the current value. Defaults to 10.",
                  "default": 10,
                  "example": 10
                }
              }
            },
            "ResetBody": {
              "type": "object",
              "properties": {
                "value": {
                  "type": "integer",
                  "description": "The value to reset the counter to. Defaults to 0.",
                  "default": 0,
                  "example": 0
                }
              }
            },
            "ErrorResponse": {
              "type": "object",
              "required": ["error"],
              "properties": {
                "error": {
                  "type": "string",
                  "description": "Human-readable error message",
                  "example": "Internal server error"
                }
              }
            }
          }
        }
      }
    </script>

    <script>
      window.onload = () => {
        // First try to read the spec from the inline <script> block so that
        // this file works when opened directly via file:// (no server needed).
        // If for some reason that fails, fall back to fetching openapi.json.
        function initUI(spec) {
          window.ui = SwaggerUIBundle({
            spec,
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            plugins: [SwaggerUIBundle.plugins.DownloadUrl],
            layout: 'StandaloneLayout',
            docExpansion: 'list',
            defaultModelsExpandDepth: 1,
          })
        }

        function showError(msg) {
          document.getElementById('swagger-ui').innerHTML =
            '<p style="color:red;padding:24px;font-family:sans-serif;">' +
            '<strong>Error loading API spec:</strong> ' +
            msg +
            '<br><br>Make sure <code>openapi.json</code> is in the same directory as this file.</p>'
        }

        try {
          const inlineSpec = JSON.parse(document.getElementById('openapi-spec').textContent)
          initUI(inlineSpec)
        } catch (inlineErr) {
          // Fallback: fetch the external file (works when served over HTTP/S)
          fetch('./openapi.json')
            .then((res) => {
              if (!res.ok) throw new Error('Could not load openapi.json')
              return res.json()
            })
            .then(initUI)
            .catch((err) => showError(err.message))
        }
      }
    </script>
  </body>
</html>
